<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pipeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#pipeBg)"/>
  <!-- Pipe body -->
  <rect x="20" y="38" width="60" height="24" rx="4" fill="url(#pipeMetal)"/>
  <ellipse cx="20" cy="50" rx="5" ry="12" fill="#0284c7"/>
  <ellipse cx="80" cy="50" rx="5" ry="12" fill="#7dd3fc"/>
  <!-- Pipe connector ring -->
  <rect x="44" y="34" width="12" height="32" rx="3" fill="#ffffff" opacity="0.9"/>
  <line x1="28" y1="42" x2="72" y2="42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
