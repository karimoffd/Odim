<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="brassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#brassBg)"/>
  <!-- Red handle -->
  <rect x="28" y="24" width="44" height="10" rx="5" fill="#ef4444"/>
  <circle cx="50" cy="29" r="3" fill="#ffffff"/>
  <!-- Valve neck -->
  <rect x="44" y="34" width="12" height="14" fill="url(#brassGold)"/>
  <!-- Body -->
  <circle cx="50" cy="56" r="14" fill="url(#brassGold)"/>
  <rect x="22" y="50" width="56" height="12" rx="3" fill="url(#brassGold)"/>
  <!-- Screw rings -->
  <rect x="20" y="47" width="5" height="18" rx="2" fill="#fde047"/>
  <rect x="75" y="47" width="5" height="18" rx="2" fill="#fde047"/>
</svg>
